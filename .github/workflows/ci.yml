name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Check formatting
        run: cmake -B build -G Ninja && cmake --build build --target format-check

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev libqt6network6 \
            libqtermwidget6-dev \
            libssh2-1-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: banchoxterm-linux-x64
          path: build/banchoxterm

  build-windows:
    runs-on: windows-latest
    continue-on-error: true

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qtermwidget6
            mingw-w64-ucrt-x86_64-libssh2
            mingw-w64-ucrt-x86_64-gcc

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: banchoxterm-windows-x64
          path: build/banchoxterm.exe
