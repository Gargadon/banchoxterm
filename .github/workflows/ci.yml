name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Required by softprops/action-gh-release to create/update the GitHub release
# and upload the generated installers and portable archives.
permissions:
  contents: write

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Check formatting
        shell: bash
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qt6-base-dev qt6-serialport-dev qt6-tools-dev-tools \
            libssl-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBANCHO_ENABLE_VNC=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    # Windows binaries, installers and portable archives are release-only.
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      # Let x64 and ARM64 finish independently so a failure in one matrix
      # entry does not hide the actual error from the other architecture.
      fail-fast: false
      matrix:
        arch:
          - name: x64
            runner: windows-latest
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            python_arch: x64
            vnc: ON
          - name: arm64
            # Native ARM64 runner is required to execute ARM64 tests.
            runner: windows-11-vs2026-arm
            qt_arch: win64_msvc2022_arm64
            cmake_arch: ARM64
            python_arch: arm64
            # The bundled libvncserver/minilzo code does not support MSVC
            # ARM64 (it requires the missing LZO_OS_WIN64 define).
            vnc: OFF

    runs-on: ${{ matrix.arch.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Avoid the unreadable WindowsApps Store alias (EACCES) when
      # install-qt-action/aqt inspects Python executables on PATH.
      - name: Select hosted Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch.python_arch }}

      - name: Remove WindowsApps Python alias
        shell: pwsh
        run: |
          $windowsApps = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          $env:Path = (($env:Path -split ';' | Where-Object {
            $_ -and $_.TrimEnd('\') -ne $windowsApps.TrimEnd('\')
          }) -join ';')
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$env:Path"
          python --version
          where.exe python

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.8.3 is the latest public Qt 6.8 package available through
          # aqt-list-server and supports the MSVC Windows ARM64 target.
          version: '6.8.3'
          arch: ${{ matrix.arch.qt_arch }}
          modules: 'qtserialport'
          cache: true

      - name: Download VcXsrv companion
        shell: pwsh
        run: |
          # VcXsrv is built and released by Gargadon/vcxsrv, never by this
          # repository. Keep this version pinned for reproducible app builds.
          $version = 'v21.1.16.1'
          $arch = '${{ matrix.arch.name }}'
          $archive = Join-Path $env:RUNNER_TEMP "vcxsrv-windows-$arch.zip"
          $root = Join-Path $env:GITHUB_WORKSPACE "third_party\vcxsrv-$arch-package"
          $url = "https://github.com/Gargadon/vcxsrv/releases/download/$version/vcxsrv-windows-$arch.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
            Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
            if ($arch -eq 'arm64') {
              Add-Content -Path $env:GITHUB_ENV -Value "BANCHO_VCXSRV_ARM64_DIR=$root"
            } else {
              Add-Content -Path $env:GITHUB_ENV -Value "BANCHO_VCXSRV_DIR=$root"
            }
            Write-Host "Using VcXsrv companion $version from $url"
          } catch {
            Write-Warning "VcXsrv companion $version is not available; packaging without a bundled X server. $($_.Exception.Message)"
          }

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-B', 'build',
            '-A', '${{ matrix.arch.cmake_arch }}',
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            '-DBANCHO_ENABLE_VNC=${{ matrix.arch.vnc }}',
            '-DBANCHO_ENABLE_IPO=OFF'
          )
          if ($env:BANCHO_VCXSRV_ARM64_DIR) {
            $cmakeArgs += "-DBANCHO_VCXSRV_ARM64_DIR=$env:BANCHO_VCXSRV_ARM64_DIR"
          }
          if ($env:BANCHO_VCXSRV_DIR) {
            $cmakeArgs += "-DBANCHO_VCXSRV_DIR=$env:BANCHO_VCXSRV_DIR"
          }
          cmake @cmakeArgs

      - name: Build application
        run: cmake --build build --config Release --target banchoxterm --parallel 2

      - name: Build tests
        run: cmake --build build --config Release --target banchoxterm_tests --parallel 2

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage package (windeployqt + libssh2)
        run: |
          New-Item -ItemType Directory -Path pkg\banchoxterm -Force
          Copy-Item build\Release\banchoxterm.exe pkg\banchoxterm\
          Copy-Item build\_deps\libssh2-build\src\Release\libssh2.dll pkg\banchoxterm\ -ErrorAction SilentlyContinue
          Copy-Item build\_deps\libssh2-build\src\libssh2.dll pkg\banchoxterm\ -ErrorAction SilentlyContinue
          Copy-Item -Path "third_party\qtermwidget\lib\color-schemes" -Destination "pkg\banchoxterm\" -Recurse -Force
          Copy-Item -Path "third_party\qtermwidget\lib\kb-layouts" -Destination "pkg\banchoxterm\" -Recurse -Force
          Copy-Item -Path "third_party\qtermwidget\lib\translations" -Destination "pkg\banchoxterm\" -Recurse -Force
          # VcXsrv is an external companion process. If the configure step
          # copied an architecture-specific bundle into build\xservers, put
          # that tree in both the installer payload and the portable ZIP.
          $vcxBuildDir = Join-Path $env:GITHUB_WORKSPACE "build\xservers\vcxsrv-${{ matrix.arch.name }}"
          $vcxPackageDir = Join-Path $env:GITHUB_WORKSPACE "pkg\banchoxterm\xservers\vcxsrv-${{ matrix.arch.name }}"
          if (Test-Path -LiteralPath (Join-Path $vcxBuildDir "vcxsrv.exe")) {
            New-Item -ItemType Directory -Path $vcxPackageDir -Force | Out-Null
            Copy-Item -Path (Join-Path $vcxBuildDir "*") -Destination $vcxPackageDir -Recurse -Force
            Write-Host "Bundled VcXsrv from $vcxBuildDir"
          } else {
            Write-Host "No VcXsrv ${{ matrix.arch.name }} bundle found; continuing without bundled X server."
          }
          windeployqt --release --compiler-runtime pkg\banchoxterm\banchoxterm.exe

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $dist = (Resolve-Path "pkg\banchoxterm").Path
          $nsh = Join-Path (Resolve-Path "build") "version.nsh"
          $script = (Resolve-Path "packaging\windows\installer.nsi").Path
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            $nsisDir = Join-Path $env:ProgramFiles "NSIS"
            $makensis = Join-Path $nsisDir "makensis.exe"
          }
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "NSIS was installed but makensis.exe was not found at $makensis"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          # Use an absolute script path so NSIS resolves __FILEDIR__ to the
          # actual packaging directory instead of prefixing it twice.
          & $makensis "-DVERSION_NSH=$nsh" "-DDIST_DIR=$dist" $script
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $installer = Join-Path (Split-Path -Parent $script) "BanchoXterm-Setup.exe"
          $artifact = Join-Path $env:GITHUB_WORKSPACE "BanchoXterm-Setup-${{ matrix.arch.name }}.exe"
          Copy-Item -LiteralPath $installer -Destination $artifact

      - name: Create portable ZIP
        run: |
          # The portable edition stores settings next to the exe (portable.ini marker).
          New-Item -ItemType File -Path pkg\banchoxterm\portable.ini -Force
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\pkg\banchoxterm\*" -DestinationPath "$env:GITHUB_WORKSPACE\BanchoXterm-windows-${{ matrix.arch.name }}.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: banchoxterm-windows-${{ matrix.arch.name }}-installer
          path: BanchoXterm-Setup-${{ matrix.arch.name }}.exe

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: banchoxterm-windows-${{ matrix.arch.name }}-portable
          path: BanchoXterm-windows-${{ matrix.arch.name }}.zip

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/BanchoXterm-Setup-x64.exe
            artifacts/BanchoXterm-Setup-arm64.exe
            artifacts/BanchoXterm-windows-x64.zip
            artifacts/BanchoXterm-windows-arm64.zip
